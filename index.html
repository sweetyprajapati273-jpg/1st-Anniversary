<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You 🐼🐻</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="scene">

    <!-- Floating Hearts -->
    <div class="hearts"></div>

    <!-- SCREEN 1 -->
    <section class="screen active" id="s1">

      <div class="animals">
        <div class="animal panda">🐼</div>
        <div class="animal bear">🐻</div>
      </div>

      <h1>Imagine receiving this on your anniversary 💗</h1>

      <p class="hint">
        Tap anywhere to start
      </p>

      <button class="start">
        START 💕
      </button>

    </section>


    <!-- SCREEN 2 -->
    <section class="screen" id="s2">

      <div class="card">

        <div class="animals small">
          <div class="animal panda">🐼</div>
          <div class="animal bear">🐻</div>
        </div>

        <div class="kiss">💋</div>

        <h2>Wrong? 😭</h2>

        <p>
          Just kidding… I found the right person. ❤️
        </p>

        <button class="next">
          Continue →
        </button>

      </div>

    </section>


    <!-- SCREEN 3 : PHOTO 1 -->
    <section class="screen" id="s3">

      <div class="photo-wrap">

        <img
          src="assets/photo1.jpg"
          alt="Photo 1"
        >

        <div class="photo-sticker">
          🐼 ❤️ 🐻
        </div>

      </div>

      <p class="caption">
        Every memory with you feels special.
      </p>

      <button class="next">
        Next 💗
      </button>

    </section>


    <!-- SCREEN 4 : PHOTO 2 -->
    <section class="screen" id="s4">

      <div class="photo-wrap portrait">

        <img
          src="assets/photo2.jpg"
          alt="Photo 2"
        >

      </div>

      <p class="caption">
        And somehow… you make ordinary moments beautiful.
      </p>

      <button class="next">
        Next 🥹
      </button>
